{% extends 'base.html' %}

<!-- http://127.0.0.1:8000/smart/notes/1 -->


<!-- Use if have a base template -->

{% block content %}
<div class="border round">
    <h1 class="my-5">{{ note.title }}</h1>
    <p>{{ note.text }}</p>
</div>
<br>
<a href="{% url 'notes.list' %}" class="btn btn-secondary">Back to Notes List</a>
<a href="{% url 'notes.update' pk=note.id %}" class="btn btn-secondary">Edit note</a>
<a href="{% url 'notes.delete' pk=note.id %}" class="btn btn-danger">Delete note</a>

{% endblock %}
