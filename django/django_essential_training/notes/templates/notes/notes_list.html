{% extends 'base.html' %}

<!-- http://127.0.0.1:8000/smart/notes -->


{% block content %}
	<h1 class="my-5">These are the notes:</h1>
		<a href="{% url 'notes.new' %}" class="text-dark text-decoration-non">
			<p>Create new note</p>
		</a>
		<div class="row row-cols3 g-2">
			{% for note in notes %}
			<div class="col">
				<div class="p-3 border">
					<a href="{% url 'notes.detail' pk=note.id %}" class="text-dark text-decoration-non">
						<h3>{{note.title}}</h3>
					</a>
					{{ note.text | truncatechars:13 }}

				</div>
			</div>
			{% endfor %}

		</div>
	
{% endblock %}
